name: Actualisation EDT

on:
  #schedule:
    #- cron: '0 * * * *' # Toutes les heures
  workflow_dispatch: # Bouton manuel

permissions:
  contents: write

jobs:
  run-edt-updater:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère ton code ET l'ancien PDF (edt.pdf) stocké sur GitHub
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Télécharge le PDF actuel depuis le site
      - name: Télécharger le nouveau PDF en ligne
        run: curl -k -o edt_nouveau.pdf "https://stri.fr/Gestion_STRI/TAV/L3/EDT_STRI1A_L3IRT_TAV.pdf"

      # 3. Compare le nouveau avec l'ancien
      - name: Comparer les PDF
        id: verification
        run: |
          # Si edt.pdf n'existe pas (lors du tout premier lancement), on le crée vide
          touch edt.pdf 
          
          # La commande 'cmp' compare les deux fichiers silencieusement
          if cmp -s edt_nouveau.pdf edt.pdf; then
            echo "📄 Aucun changement détecté dans le PDF. Arrêt."
            echo "run_script=false" >> $GITHUB_OUTPUT
          else
            echo "🚨 Le PDF a changé ! On prépare l'exécution."
            # On remplace l'ancien par le nouveau pour que Python puisse le lire
            mv edt_nouveau.pdf edt.pdf
            echo "run_script=true" >> $GITHUB_OUTPUT
          fi

      # --- À PARTIR D'ICI, LES ÉTAPES NE SE LANCENT QUE SI LE PDF A CHANGÉ ---

      - name: Set up Python
        if: steps.verification.outputs.run_script == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (Poppler)
        if: steps.verification.outputs.run_script == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        if: steps.verification.outputs.run_script == 'true'
        run: pip install -r requirements.txt

      - name: Prepare Google Drive Secrets
        if: steps.verification.outputs.run_script == 'true'
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          echo "$GDRIVE_TOKEN" > token.json

      - name: Run Python script
        if: steps.verification.outputs.run_script == 'true'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python edt_stri.py

      # 4. On sauvegarde le PDF ET les données JSON sur GitHub
      - name: Sauvegarder les fichiers sur le dépôt
        if: steps.verification.outputs.run_script == 'true'
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add edt.pdf edt_data.json
          git commit -m "Mise à jour automatique de l'EDT" || echo "Rien à commiter"
          git push