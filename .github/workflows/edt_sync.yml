name: Actualisation EDT

# Le téléchargement n'est plus un script Python recopié dans le YAML : la CI
# appelle `edt_stri.py --telecharger`, unique source de vérité pour l'URL.

on:
  schedule:
    - cron: '0 * * * *' # Toutes les heures
  workflow_dispatch: # Bouton manuel

permissions:
  contents: write

concurrency:
  # Évite deux exécutions simultanées qui pousseraient des commits conflictuels.
  group: edt-sync
  cancel-in-progress: false

jobs:
  run-edt-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # garde-fou : un job bloqué ne consomme plus 6 h

    steps:
      # 1. Récupère le code ET l'ancien PDF (edt.pdf) stocké sur GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Même version qu'en local : évite de découvrir une incompatibilité
          # de dépendance uniquement en CI.
          python-version: '3.13'

      # 2. Outils nécessaires au téléchargement anti-bot
      - name: Install download tools
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      # 3. Télécharge le PDF via la fonction du dépôt (URL définie une seule
      #    fois dans edt_stri.py, surchargeable par la variable EDT_PDF_URL)
      - name: Télécharger le nouveau PDF
        env:
          EDT_PDF_URL: ${{ vars.EDT_PDF_URL }}
        run: python edt_stri.py --telecharger edt_nouveau.pdf

      # 4. Compare le nouveau avec l'ancien
      - name: Comparer les PDF
        id: verification
        run: |
          touch edt.pdf

          if cmp -s edt_nouveau.pdf edt.pdf; then
            echo "📄 Aucun changement détecté dans le PDF. Arrêt."
            echo "run_script=false" >> $GITHUB_OUTPUT
          else
            echo "🚨 Le PDF a changé ! On prépare l'exécution."
            mv edt_nouveau.pdf edt.pdf
            echo "run_script=true" >> $GITHUB_OUTPUT
          fi

      # --- À PARTIR D'ICI, LES ÉTAPES NE SE LANCENT QUE SI LE PDF A CHANGÉ ---

      - name: Install system dependencies (Poppler)
        if: steps.verification.outputs.run_script == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        if: steps.verification.outputs.run_script == 'true'
        run: pip install -r requirements.txt

      # GDRIVE_TOKEN doit couvrir DEUX périmètres : drive.file ET calendar.
      # Un jeton limité au Drive se rafraîchit sans erreur mais fait échouer la
      # synchronisation de l'agenda en 403.
      - name: Prepare Google Secrets
        if: steps.verification.outputs.run_script == 'true'
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          printf '%s' "$GDRIVE_CREDENTIALS" > credentials.json
          printf '%s' "$GDRIVE_TOKEN" > token.json

          python - <<'PY'
          import json, sys
          attendus = {
              "https://www.googleapis.com/auth/drive.file",
              "https://www.googleapis.com/auth/calendar",
          }
          try:
              jeton = json.load(open("token.json"))
          except Exception as e:
              sys.exit(f"::error::GDRIVE_TOKEN illisible ({e}).")
          manquants = attendus - set(jeton.get("scopes", []))
          if manquants:
              print(f"::warning::GDRIVE_TOKEN ne couvre pas {', '.join(sorted(manquants))}. "
                    "Régénère token.json en local puis mets à jour le secret.")
          if not jeton.get("refresh_token"):
              sys.exit("::error::GDRIVE_TOKEN sans refresh_token : inutilisable en CI.")
          PY

      - name: Run Python script
        id: traitement
        if: steps.verification.outputs.run_script == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EDT_PDF_URL: ${{ vars.EDT_PDF_URL }}
          # Agenda cible : laisser vide pour le retrouver par son nom.
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
        run: python edt_stri.py

      # Les secrets ne doivent pas survivre à l'étape suivante, qui commite.
      - name: Effacer les identifiants
        if: always()
        run: rm -f credentials.json token.json

      # 5. Sauvegarde le PDF ET les données JSON.
      #    Le script rend un code de sortie non nul si l'extraction est
      #    incomplète : dans ce cas l'étape est sautée, edt.pdf n'est PAS
      #    commité, et la prochaine exécution horaire réessaiera.
      - name: Sauvegarder les fichiers sur le dépôt
        if: steps.traitement.outcome == 'success'
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add edt.pdf edt_data.json
          git commit -m "Mise à jour automatique de l'EDT" || echo "Rien à commiter"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
