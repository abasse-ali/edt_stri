name: Actualisation EDT

# Le téléchargement n'est plus un script Python recopié dans le YAML : la CI
# appelle `telechargement.py --promo`, unique source de vérité pour les URL.

on:
  schedule:
    - cron: '0 * * * *' # Toutes les heures
  workflow_dispatch: # Bouton manuel

permissions:
  contents: write

concurrency:
  # Évite deux exécutions simultanées qui pousseraient des commits conflictuels.
  group: edt-sync
  cancel-in-progress: false

jobs:
  run-edt-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # garde-fou : un job bloqué ne consomme plus 6 h

    steps:
      # 1. Récupère le code ET les anciens PDF stockés sur GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Même version qu'en local : évite de découvrir une incompatibilité
          # de dépendance uniquement en CI.
          python-version: '3.13'

      # 2. Outils nécessaires au téléchargement anti-bot
      - name: Install download tools
        run: |
          pip install playwright requests python-dotenv
          playwright install --with-deps chromium

      # 3. Télécharge les deux PDF via le module léger du dépôt.
      #    telechargement.py n'importe que requests et playwright : appeler
      #    edt_stri.py ici échouerait, requirements.txt n'étant pas encore
      #    installé et le module important numpy dès son chargement.
      - name: Télécharger les nouveaux PDF
        run: |
          python telechargement.py --promo M1 edt_m1_nouveau.pdf
          python telechargement.py --promo L3 edt_l3_nouveau.pdf

      # 4. Compare chaque PDF avec sa version précédente. Une seule promotion
      #    modifiée suffit à déclencher la suite : les passes sont idempotentes,
      #    celles dont rien n'a bougé rendent 0 ajout / 0 modification.
      - name: Comparer les PDF
        id: verification
        run: |
          touch edt_m1.pdf edt_l3.pdf
          change=false

          if cmp -s edt_m1_nouveau.pdf edt_m1.pdf; then
            echo "📄 M1 inchangé."
          else
            echo "🚨 Le PDF M1 a changé."
            mv edt_m1_nouveau.pdf edt_m1.pdf
            change=true
          fi

          if cmp -s edt_l3_nouveau.pdf edt_l3.pdf; then
            echo "📄 L3 inchangé."
          else
            echo "🚨 Le PDF L3 a changé."
            mv edt_l3_nouveau.pdf edt_l3.pdf
            change=true
          fi

          echo "run_script=$change" >> $GITHUB_OUTPUT

      # --- À PARTIR D'ICI, LES ÉTAPES NE SE LANCENT QUE SI UN PDF A CHANGÉ ---

      - name: Install system dependencies (Poppler)
        if: steps.verification.outputs.run_script == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        if: steps.verification.outputs.run_script == 'true'
        run: pip install -r requirements.txt

      # GDRIVE_TOKEN : nom historique, le jeton ne sert plus qu'à l'API
      # Calendar. Le fichier de client OAuth n'est plus écrit — il ne servait
      # qu'au flux d'autorisation interactif, impossible en CI de toute façon.
      - name: Prepare Google token
        if: steps.verification.outputs.run_script == 'true'
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          printf '%s' "$GDRIVE_TOKEN" > token.json

          python - <<'PY'
          import json, sys
          try:
              jeton = json.load(open("token.json"))
          except Exception as e:
              sys.exit(f"::error::GDRIVE_TOKEN illisible ({e}).")
          if "https://www.googleapis.com/auth/calendar" not in jeton.get("scopes", []):
              sys.exit("::error::GDRIVE_TOKEN ne couvre pas l'agenda. Regenere "
                       "token.json en local (python test_local.py) puis mets a jour le secret.")
          if not jeton.get("refresh_token"):
              sys.exit("::error::GDRIVE_TOKEN sans refresh_token : inutilisable en CI.")
          PY

      # Deux promotions, deux demi-promos chacune : quatre agendas de cours et
      # quatre d'examens. Les demi-promos sont empilées dans les mêmes cases du
      # PDF, seule leur position les distingue.
      #
      #   M1 BAS  -> STRI M1 G2     M1 HAUT  -> STRI Ingé2 G1
      #   L3 BAS  -> IRT L3          L3 HAUT  -> STRI Ingé1
      - name: Run Python script
        id: traitement
        if: steps.verification.outputs.run_script == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EDT_PROMO=M1 EDT_MOITIE=BAS  python edt_stri.py
          EDT_PROMO=M1 EDT_MOITIE=HAUT python edt_stri.py
          EDT_PROMO=L3 EDT_MOITIE=BAS  python edt_stri.py
          EDT_PROMO=L3 EDT_MOITIE=HAUT python edt_stri.py

      # Les secrets ne doivent pas survivre à l'étape suivante, qui commite.
      - name: Effacer le jeton
        if: always()
        run: rm -f token.json

      # 5. Sauvegarde les PDF ET les données JSON.
      #    Le script rend un code de sortie non nul si l'extraction est
      #    incomplète : dans ce cas l'étape est sautée, les PDF ne sont PAS
      #    commités, et la prochaine exécution horaire réessaiera.
      - name: Sauvegarder les fichiers sur le dépôt
        if: steps.traitement.outcome == 'success'
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add edt_m1.pdf edt_l3.pdf edt_data*.json
          git commit -m "Mise à jour automatique de l'EDT" || echo "Rien à commiter"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
