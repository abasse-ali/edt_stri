name: Actualisation EDT

on:
  schedule:
    - cron: '0 * * * *' # Toutes les heures
  workflow_dispatch: # Bouton manuel

permissions:
  contents: write

jobs:
  run-edt-updater:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère ton code ET l'ancien PDF (edt.pdf) stocké sur GitHub
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Initialiser Python DÈS LE DÉBUT (nécessaire pour le téléchargement anti-bot)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.3'

      # 3. Installer les outils pour contourner l'anti-bot (Playwright)
      - name: Install download tools
        run: |
          pip install playwright requests
          playwright install chromium

      # 4. Télécharger le PDF en contournant le WAF "Tiger Protect" via Playwright
      - name: Télécharger le nouveau PDF via Playwright
        run: |
          cat << 'EOF' > download_pdf.py
          import requests
          import time
          from playwright.sync_api import sync_playwright

          pdf_url = 'https://stri.fr/Gestion_STRI/TAV/M1/EDT_STRI4A-M1RT_TAV.pdf'
          base_url = 'https://stri.fr/'

          with sync_playwright() as p:
              print("🌐 Lancement du navigateur fantôme...")
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')
              page = context.new_page()
              
              print("🛡️ Passage de la vérification anti-bot (Tiger Protect)...")
              page.goto(base_url)
              time.sleep(10) # Laisse le temps au JavaScript de valider
              
              print("🍪 Récupération du cookie d'accès...")
              cookies = context.cookies()
              cookie_dict = {c['name']: c['value'] for c in cookies}
              browser.close()

          print("📥 Téléchargement du fichier PDF...")
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
          response = requests.get(pdf_url, headers=headers, cookies=cookie_dict)

          with open('edt_nouveau.pdf', 'wb') as f:
              f.write(response.content)

          print("✅ Téléchargement terminé !")
          EOF
          
          python download_pdf.py
          
          # Sécurité : On vérifie que les 4 premiers caractères sont bien "%PDF"
          if ! head -c 4 edt_nouveau.pdf | grep -q "%PDF"; then
            echo "❌ Erreur : Le fichier téléchargé n'est pas un PDF valide !"
            head -n 10 edt_nouveau.pdf
            exit 1
          fi

      # 5. Compare le nouveau avec l'ancien
      - name: Comparer les PDF
        id: verification
        run: |
          touch edt.pdf 
          
          if cmp -s edt_nouveau.pdf edt.pdf; then
            echo "📄 Aucun changement détecté dans le PDF. Arrêt."
            echo "run_script=false" >> $GITHUB_OUTPUT
          else
            echo "🚨 Le PDF a changé ! On prépare l'exécution."
            mv edt_nouveau.pdf edt.pdf
            echo "run_script=true" >> $GITHUB_OUTPUT
          fi

      # --- À PARTIR D'ICI, LES ÉTAPES NE SE LANCENT QUE SI LE PDF A CHANGÉ ---

      - name: Install system dependencies (Poppler)
        if: steps.verification.outputs.run_script == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        if: steps.verification.outputs.run_script == 'true'
        run: pip install -r requirements.txt

      - name: Prepare Google Drive Secrets
        if: steps.verification.outputs.run_script == 'true'
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          echo "$GDRIVE_TOKEN" > token.json

      - name: Run Python script
        if: steps.verification.outputs.run_script == 'true'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python edt_stri.py

      # 6. On sauvegarde le PDF ET les données JSON sur GitHub
      - name: Sauvegarder les fichiers sur le dépôt
        if: steps.verification.outputs.run_script == 'true'
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add edt.pdf edt_data.json
          git commit -m "Mise à jour automatique de l'EDT" || echo "Rien à commiter"
          git push
